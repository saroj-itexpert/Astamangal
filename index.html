<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#123b35" />
    <meta name="description" content="Secure member and board portal for Ashtamangal Kosh." />
    <title>Ashtamangal Kosh</title>
  </head>
  <body>
    <div id="app">
      <main class="startup-message">
        <section>
          <h1>Start Ashtamangal Kosh with Vite</h1>
          <p>This app cannot run from VS Code Live Server. It needs Vite to load its frontend modules.</p>
          <p>Open a terminal in the project folder and run <code>npm install</code>, then <code>npm run dev</code>. Open the local URL Vite prints, usually <code>http://localhost:5173</code>.</p>
        </section>
      </main>
    </div>
    <style>
      .startup-message{min-height:100vh;display:grid;place-items:center;padding:20px;background:#f4f7f6;color:#172b28;font:16px/1.6 system-ui,sans-serif}
      .startup-message section{max-width:560px;padding:28px;background:#fff;border:1px solid #dfe8e4;border-radius:14px}
      .startup-message h1{color:#123b35}
      .startup-message code{padding:2px 5px;background:#e8f5ef;border-radius:4px}
    </style>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
